<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xóa icon trong văn bản tiếng Trung</title>
<meta name="description" content="Dán văn bản tiếng Trung, xóa emoji/icon, chỉ giữ chữ Hán và dấu câu. Chạy hoàn toàn trên trình duyệt.">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5d6673;
    --line: #d8dde4; --accent: #2b5fd9; --accent-text: #ffffff; --ok: #1a7f4b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c; --card: #1c2027; --text: #e8ebf0; --muted: #9aa3b0;
      --line: #323945; --accent: #6b93f5; --accent-text: #0e1116; --ok: #55c98a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }

  /* Thanh trên cùng: tiêu đề + công cụ */
  header { flex: none; padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  h1 { font-size: 1.05rem; margin: 0; white-space: nowrap; }
  .opts { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
  .opts label { display: inline-flex; gap: 6px; align-items: center; font-size: .88rem; cursor: pointer; white-space: nowrap; }
  #status { margin-left: auto; color: var(--muted); font-size: .88rem; }
  #status.ok { color: var(--ok); }

  /* Hai khung chiếm hết phần còn lại của màn hình */
  main {
    flex: 1; min-height: 0; padding: 10px 14px 14px;
    display: grid; gap: 12px; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr);
  }
  @media (max-width: 760px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
    h1 { white-space: normal; font-size: .95rem; width: 100%; }
    header { padding: 6px 10px; }
    .bar { gap: 4px 10px; }
    .opts { gap: 2px 10px; }
    .opts label { font-size: .8rem; }
    #status { margin-left: 0; width: 100%; font-size: .8rem; }
    main { padding: 8px 10px 10px; gap: 8px; }
    .pane { padding: 8px; }
    .head { flex-wrap: nowrap; margin-bottom: 6px; }
    .head b { font-size: .85rem; white-space: nowrap; }
    .count { display: none; }
    .head button { padding: 5px 8px; font-size: .78rem; white-space: nowrap; }
    button.primary, #clear { padding: 5px 10px; font-size: .82rem; }
    textarea { font-size: 16px; padding: 8px; }
  }
  .pane {
    min-height: 0; min-width: 0; display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  }
  .head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .head b { font-size: .92rem; }
  .count { color: var(--muted); font-size: .8rem; font-weight: 400; margin-left: 6px; }
  textarea {
    flex: 1; min-height: 0; width: 100%; resize: none; overflow: auto; padding: 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text);
    font: 17px/1.7 "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit; font-size: .88rem; padding: 6px 11px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Xóa icon trong văn bản tiếng Trung</h1>
    <button class="primary" id="run" title="Ctrl+Enter">Xóa icon</button>
    <button id="clear">Làm mới</button>
    <div class="opts">
      <label><input type="checkbox" id="digits"> Giữ chữ số</label>
      <label><input type="checkbox" id="latin"> Giữ chữ Latin</label>
      <label><input type="checkbox" id="symbols"> Giữ ký hiệu</label>
      <label><input type="checkbox" id="collapse"> Gộp dấu cách thừa</label>
    </div>
    <span id="status" role="status">Dán văn bản rồi bấm “Xóa icon” (Ctrl+Enter). Xử lý ngay trên máy bạn.</span>
  </div>
</header>

<main>
  <section class="pane">
    <div class="head">
      <b>Văn bản gốc<span class="count" id="cin"></span></b>
      <div class="btns">
        <button id="paste">Dán từ clipboard</button>
        <button id="open">Mở file…</button>
      </div>
    </div>
    <textarea id="inp" placeholder="连遮一遮回家都很不方便。你着急，我帮你问老师请个假好不好？😊他断然拒绝，" spellcheck="false"></textarea>
    <input type="file" id="file" accept=".txt,.md,text/plain" hidden>
  </section>

  <section class="pane">
    <div class="head">
      <b>Kết quả<span class="count" id="cout"></span></b>
      <div class="btns">
        <button id="copy">Sao chép</button>
        <button id="save">Tải về .txt</button>
      </div>
    </div>
    <textarea id="out" spellcheck="false"></textarea>
  </section>
</main>

<script>
"use strict";

// ---- Logic: tương đương remove_emoji_zh.py ----
const KEYCAP = /[0-9#*]\uFE0F?\u20E3/gu;
const HAN = /^[\p{Script=Han}\p{Script=Bopomofo}]$/u;
const PUNCT_OR_SPACE = /^[\p{P}\p{Zs}\p{Zl}\p{Zp}]$/u;
const LATIN_LETTER = /^(?=\p{L})\p{Script=Latin}$/u;
const SYMBOL = /^[\p{Sm}\p{Sc}]$/u;
const EMOJI_PUNCT = new Set([0x203C, 0x2049, 0x3030, 0x303D]); // ‼ ⁉ 〰 〽
const ASCII_PUNCT = new Set(Array.from("!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~"));

function keep(ch, o) {
  const cp = ch.codePointAt(0);
  if (HAN.test(ch)) return true;
  if (EMOJI_PUNCT.has(cp)) return false;
  if (ch === "\n" || ch === "\r" || ch === "\t") return true;
  if (ASCII_PUNCT.has(ch) || cp === 0xFF5E) return true; // ～
  if (PUNCT_OR_SPACE.test(ch)) return true;
  if (o.digits && ((cp >= 0x30 && cp <= 0x39) || (cp >= 0xFF10 && cp <= 0xFF19))) return true;
  if (o.latin && LATIN_LETTER.test(ch)) return true;
  if (o.symbols && SYMBOL.test(ch) && cp < 0x1F000) return true;
  return false; // emoji, variation selector, ZWJ, skin tone, cờ...
}

// Cache theo ký tự để file dài (hàng triệu ký tự) vẫn xử lý nhanh
function cleanText(text, o = {}) {
  const cache = new Map();
  const parts = [];
  for (const ch of text.replace(KEYCAP, "")) {
    let k = cache.get(ch);
    if (k === undefined) { k = keep(ch, o); cache.set(ch, k); }
    if (k) parts.push(ch);
  }
  let out = parts.join("");
  if (o.collapse) out = out.replace(/ {2,}/g, " ").replace(/[ \t]+$/gm, "");
  return out;
}

// ---- UI ----
const $ = id => document.getElementById(id);
const inp = $("inp"), out = $("out"), status = $("status");
const fmt = n => n.toLocaleString("vi-VN");
const len = s => { let n = 0; for (const _ of s) n++; return n; };

function say(msg, ok = false) { status.textContent = msg; status.className = ok ? "ok" : ""; }
function opts() {
  return { digits: $("digits").checked, latin: $("latin").checked,
           symbols: $("symbols").checked, collapse: $("collapse").checked };
}
function counts() {
  $("cin").textContent = inp.value ? `· ${fmt(len(inp.value))} ký tự` : "";
  $("cout").textContent = out.value ? `· ${fmt(len(out.value))} ký tự` : "";
}

function run() {
  if (!inp.value.trim()) { say("Chưa có văn bản. Hãy dán nội dung vào ô bên trái."); return; }
  const t0 = performance.now();
  out.value = cleanText(inp.value, opts());
  out.scrollTop = 0;
  counts();
  const removed = len(inp.value) - len(out.value);
  say(`Xong: đã xóa ${fmt(removed)} ký tự (${Math.round(performance.now() - t0)} ms).`, true);
}

async function copyResult() {
  if (!out.value) { say("Chưa có kết quả để sao chép."); return; }
  try { await navigator.clipboard.writeText(out.value); }
  catch { out.select(); document.execCommand("copy"); }
  say("Đã sao chép kết quả vào clipboard.", true);
}

$("run").addEventListener("click", run);
$("clear").addEventListener("click", () => { inp.value = out.value = ""; counts(); say("Đã làm mới."); inp.focus(); });
$("copy").addEventListener("click", copyResult);
$("paste").addEventListener("click", async () => {
  try { inp.value = await navigator.clipboard.readText(); run(); }
  catch { say("Trình duyệt chặn đọc clipboard. Hãy bấm vào ô và dán bằng Ctrl+V."); inp.focus(); }
});
$("open").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  inp.value = await f.text(); e.target.value = ""; run();
});
$("save").addEventListener("click", () => {
  if (!out.value) { say("Chưa có kết quả để tải."); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out.value], { type: "text/plain;charset=utf-8" }));
  a.download = "ket-qua.txt"; a.click(); URL.revokeObjectURL(a.href);
});
inp.addEventListener("input", counts);
inp.addEventListener("paste", () => setTimeout(run, 0));           // dán xong tự xử lý
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") run(); });
["digits", "latin", "symbols", "collapse"].forEach(id =>
  $(id).addEventListener("change", () => { if (inp.value.trim()) run(); }));
</script>
</body>
</html>
